<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Premium quality sarees at affordable wholesale rates from Anayra Collection.">
  <title>Anayra Collection | Wholesale Sarees</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--brand-red:#cc0000;--brand-red-dark:#a30000;--page-bg:#f8f9fa;--dark-text:#212529}
    body{background:var(--page-bg);color:var(--dark-text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    .hero{background:#fff;border-bottom:6px solid var(--brand-red);padding:3rem 1rem 5rem}
    .hero-logo{display:block;width:auto;max-width:120px;max-height:120px;object-fit:contain;margin:0 auto 1.25rem}
    .hero h1{font-weight:700;letter-spacing:-.02em}
    .form-wrapper{margin-top:-3rem;padding-bottom:2rem}
    .form-card{border:0;border-radius:1rem;box-shadow:0 .75rem 2rem rgba(0,0,0,.1)}
    .form-label{font-weight:600}.required-mark{color:var(--brand-red)}
    .submit-button{width:100%;background:var(--brand-red);border-color:var(--brand-red);font-weight:700;padding:.8rem 1rem}
    .submit-button:hover,.submit-button:focus{background:var(--brand-red-dark);border-color:var(--brand-red-dark)}
    footer{color:#6c757d;padding:1.5rem 1rem 2rem}footer a{color:var(--brand-red);font-weight:600;text-decoration:none}footer a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <header class="hero text-center"><div class="container">
    <img src="70081.png" alt="Anayra Collection logo" class="hero-logo" width="120" height="120">
    <h1 class="display-6 mb-2">Anayra Collection</h1>
    <p class="lead mb-0">Premium Quality Sarees at Affordable Wholesale Rates</p>
  </div></header>
  <main><div class="container form-wrapper"><div class="row justify-content-center"><div class="col-12 col-md-8 col-lg-6">
    <div class="card form-card"><div class="card-body p-4 p-md-5">
      <h2 class="h4 text-center mb-4">Get Your Wholesale Catalog</h2>
      <form id="wholesaleForm" name="submit-to-google-sheet">
        <div class="mb-3"><label for="yourName" class="form-label">Your Name <span class="required-mark" aria-hidden="true">*</span></label><input type="text" class="form-control" id="yourName" name="Your Name" autocomplete="name" required></div>
        <div class="mb-3"><label for="shopName" class="form-label">Boutique / Shop Name <span class="required-mark" aria-hidden="true">*</span></label><input type="text" class="form-control" id="shopName" name="Boutique / Shop Name" autocomplete="organization" required></div>
        <div class="mb-3"><label for="whatsappNumber" class="form-label">WhatsApp Number <span class="required-mark" aria-hidden="true">*</span></label><input type="tel" class="form-control" id="whatsappNumber" name="WhatsApp Number" autocomplete="tel" inputmode="tel" required></div>
        <div class="mb-4"><label for="gstNumber" class="form-label">GST Number <span class="text-muted fw-normal">(Optional)</span></label><input type="text" class="form-control" id="gstNumber" name="GST Number" autocomplete="off"></div>
        <button type="submit" class="btn btn-danger submit-button">Get Catalog on WhatsApp</button>
      </form>
    </div></div>
  </div></div></div></main>
  <footer class="text-center"><div class="container"><p class="mb-0">Visit us: <a href="https://share.google/YTvYLOor9DYOscM2D" target="_blank" rel="noopener noreferrer">View Store Location on Google Maps</a></p></div></footer>
  <script>
    const wholesaleForm=document.getElementById("wholesaleForm");const submitButton=wholesaleForm.querySelector('button[type="submit"]);
    const webhookUrl="https://script.google.com/macros/s/AKfycbzpG9foV4aYQi7r2OlJxF_IPsf39lSGfnjuuzRj8DGgXFPZ31r1xv628hy47OXznkTP/exec";const whatsappNumber="918252063732";const whatsappMessage="Hi, I just filled out the wholesale form and would like to see the catalog.";
    wholesaleForm.addEventListener("submit",function(event){event.preventDefault();if(!wholesaleForm.checkValidity()){wholesaleForm.reportValidity();return}const originalButtonText=submitButton.textContent;submitButton.textContent="Please wait...";submitButton.disabled=true;fetch(webhookUrl,{method:"POST",body:new URLSearchParams(new FormData(wholesaleForm)),mode:"no-cors"}).then(function(){const encodedMessage=encodeURIComponent(whatsappMessage);window.location.href=`https://wa.me/${whatsappNumber}?text=${encodedMessage}`}).catch(function(error){console.error("Wholesale form submission failed:",error);alert("Something went wrong. Please try again.");submitButton.textContent=originalButtonText;submitButton.disabled=false})});
  </script>
</body>
</html>
