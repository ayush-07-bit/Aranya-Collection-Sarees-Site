<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anayra Collection | Wholesale Sarees</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body{background-color:#f8f9fa;color:#212529;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
    .hero-section{background-color:#fff;border-bottom:4px solid #cc0000;padding:2.5rem 1rem 4.5rem;text-align:center}
    .hero-logo{max-width:120px;height:auto;margin-bottom:1rem;border-radius:12px}
    .hero-title{font-weight:700;letter-spacing:-.02em;color:#111;margin-bottom:.4rem}
    .hero-tagline{color:#495057;font-size:1rem;max-width:420px;margin:0 auto}
    .form-container-overlap{margin-top:-2.75rem;margin-bottom:2.5rem;flex:1 0 auto}
    .lead-card{background-color:#fff;border:none;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:1.75rem 1.5rem}
    @media (min-width:576px){.lead-card{padding:2.25rem 2rem}}
    .form-label{font-weight:600;font-size:.9rem;color:#212529;margin-bottom:.4rem}
    .form-control{padding:.65rem .85rem;border-radius:8px;border:1px solid #dee2e6;font-size:.95rem}
    .form-control:focus{border-color:#cc0000;box-shadow:0 0 0 .25rem rgba(204,0,0,.15)}
    .btn-wholesale{background-color:#cc0000;border-color:#cc0000;color:#fff;font-weight:600;padding:.8rem 1rem;font-size:1rem;border-radius:8px;width:100%;transition:background-color .2s ease-in-out,border-color .2s ease-in-out}
    .btn-wholesale:hover,.btn-wholesale:focus,.btn-wholesale:active{background-color:#a30000!important;border-color:#990000!important;color:#fff!important}
    .btn-wholesale:disabled{background-color:#cc0000;border-color:#cc0000;opacity:.7;cursor:not-allowed}
    .site-footer{background-color:#fff;border-top:1px solid #e9ecef;padding:1.25rem 1rem;text-align:center;font-size:.9rem;color:#6c757d}
    .map-link{color:#cc0000;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:.35rem}.map-link:hover{color:#990000;text-decoration:underline}
  </style>
</head>
<body>
  <header class="hero-section"><div class="container">
    <img src="70081.png" alt="Anayra Collection Logo" class="hero-logo">
    <h1 class="h3 hero-title">Anayra Collection</h1>
    <p class="hero-tagline">Premium Quality Sarees at Affordable Wholesale Rates</p>
  </div></header>
  <main class="container form-container-overlap"><div class="row justify-content-center"><div class="col-12 col-sm-10 col-md-7 col-lg-5">
    <div class="card lead-card">
      <h2 class="h5 fw-bold mb-1 text-center">Wholesale Inquiry</h2>
      <p class="text-muted small text-center mb-4">Enter your details below to receive our latest wholesale catalog directly on WhatsApp.</p>
      <form id="wholesaleForm" name="submit-to-google-sheet">
        <div class="mb-3"><label for="yourName" class="form-label">Your Name <span class="text-danger">*</span></label><input type="text" class="form-control" id="yourName" name="Name" placeholder="Enter your full name" autocomplete="name" required=""></div>
        <div class="mb-3"><label for="shopName" class="form-label">Boutique / Shop Name <span class="text-danger">*</span></label><input type="text" class="form-control" id="shopName" name="Shop_Name" placeholder="Enter your boutique or shop name" autocomplete="organization" required=""></div>
        <div class="mb-3"><label for="whatsappNumber" class="form-label">WhatsApp Number <span class="text-danger">*</span></label><input type="tel" class="form-control" id="whatsappNumber" name="WhatsApp_Number" placeholder="e.g. 9876543210" autocomplete="tel" inputmode="tel" required=""></div>
        <div class="mb-4"><label for="gstNumber" class="form-label">GST Number <span class="text-muted fw-normal">(Optional)</span></label><input type="text" class="form-control" id="gstNumber" name="GST_Number" placeholder="Enter 15-digit GSTIN (if applicable)" autocomplete="off"></div>
        <button type="submit" id="submitBtn" class="btn btn-wholesale">Get Catalog on WhatsApp</button>
      </form>
    </div>
  </div></div></main>
  <footer class="site-footer"><div class="container"><div class="mb-1"><a href="https://share.google/YTvYLOor9DYOscM2D" target="_blank" rel="noopener noreferrer" class="map-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"></path></svg>Visit Our Store on Google Maps</a></div><div class="small text-muted">© Anayra Collection. All rights reserved.</div></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script>
    const scriptURL="https://script.google.com/macros/s/AKfycbxSbedZKYaJEHAcSuyjSiTobawEHpFpszP-kBpCiWCX27mT3J7KfIYBvrF4MNk1zjNg/exec";
    const whatsappNumber="918252063732";
    const whatsappMessage="Hi, I just filled out the wholesale form and would like to see the catalog.";
    const form=document.getElementById("wholesaleForm");const submitBtn=document.getElementById("submitBtn");
    form.addEventListener("submit",function(e){e.preventDefault();if(!form.checkValidity()){form.reportValidity();return}submitBtn.textContent="Please wait...";submitBtn.disabled=true;fetch(scriptURL,{method:"POST",body:new URLSearchParams(new FormData(form)),mode:"no-cors"}).then(function(){const encodedMessage=encodeURIComponent(whatsappMessage);window.location.href=`https://wa.me/${whatsappNumber}?text=${encodedMessage}`}).catch(function(error){console.error("Submission Error:",error);alert("Something went wrong while submitting your details. Please try again.");submitBtn.textContent="Get Catalog on WhatsApp";submitBtn.disabled=false})});
  </script>


</body></html>
